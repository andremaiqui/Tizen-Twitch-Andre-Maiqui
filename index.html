/* ==========================================================
   OsmTwich - banner de la barra lateral
   - Abierta: banner completo (fondo negro en temas oscuros, blanco en claro)
   - Contraida: mismo banner sin texto (solo circulo con play)
   - Iconos de la barra alineados con el circulo del banner
   Todo se posiciona de forma absoluta dentro de #sidebar, asi no
   depende del padding ni del ancho real del elemento.
   ========================================================== */
#main-screen {
  --osm-banner-w: 180px;    /* ancho del banner con la barra abierta */
  --osm-banner-x: 14px;     /* separacion al borde izquierdo de la pantalla */
  --osm-banner-y: 8px;      /* separacion arriba */
  --osm-ring-cx: 0.2335;    /* centro del circulo dentro del banner (fraccion del ancho) */
  --osm-icon: 32px;         /* tamano de los iconos de la barra */
  --osm-sb-shift: 24px;     /* la barra abierta esta desplazada -24px */
  --osm-col-w: 62px;        /* ancho de la barra contraida */
  --osm-col-mark: 44px;     /* tamano del icono de la barra contraida */
}

/* ---------- BARRA ABIERTA ---------- */
#main-screen:not(.sidebar-collapsed) #sidebar #sidebar-logo {
  position: absolute !important;
  top: var(--osm-banner-y) !important;

const LAZY_CHUNK_SIZE = 12;
const lazyRowState = new Map(); // sectionId -> { streams, loaded, profileMap, loading }

function setupLazyRowLoad(sectionId, streams) {
    const track = document.getElementById(`track-${sectionId}`);
    if (!track) return;
    track.innerHTML = "";
    lazyRowState.set(sectionId, {
        streams: streams.slice(),
        loaded: 0,
        profileMap: new Map(),
        loading: false,
        cursor: (streams && streams.cursor) || "",
        done: false
    });
    loadMoreForRow(sectionId);

    const row = track.closest(".section-row");
    if (!row) return;
    const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) loadMoreForRow(sectionId);
        });
    }, { root: null, rootMargin: "200px" });
    obs.observe(track);

    track.addEventListener("scroll", () => {
        const st = lazyRowState.get(sectionId);
        if (!st || st.loading) return;
        if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 400) {
            loadMoreForRow(sectionId);
        }
    }, { passive: true });
}

async function loadMoreForRow(sectionId) {
    const st = lazyRowState.get(sectionId);
    if (!st || st.loading) return;
    if (st.loaded >= st.streams.length) {
        if (st.done || !st.cursor || st.streams.length >= GAME_ROW_MAX) return;
        st.loading = true;
        try {
            const gid = sectionId.replace(/^game-/, "");
            const data = await helixGet(`streams?game_id=${encodeURIComponent(gid)}&first=${ROW_MORE_PAGE}&after=${encodeURIComponent(st.cursor)}`);
            const seen = new Set(st.streams.map(x => x.id));
            const fresh = (data.data || []).filter(x => !seen.has(x.id));
            fresh.forEach(x => st.streams.push(x));
            st.cursor = (data.pagination && data.pagination.cursor) || "";
            if (!st.cursor || !fresh.length) st.done = true;
        } catch (_) { st.done = true; }
        st.loading = false;
        if (lazyRowState.get(sectionId) !== st) return;
        if (st.loaded >= st.streams.length) return;
    }
    st.loading = true;
    const track = document.getElementById(`track-${sectionId}`);
    if (!track) { st.loading = false; return; }
    const chunk = st.streams.slice(st.loaded, Math.min(st.loaded + LAZY_CHUNK_SIZE, GAME_ROW_MAX));
    if (!chunk.length) { st.loading = false; return; }

    const chunkProfiles = await getStreamerProfileMap(chunk);
    if (lazyRowState.get(sectionId) !== st) return;
    chunkProfiles.forEach((v, k) => st.profileMap.set(k, v));
    chunk.forEach(s => {
        const profile = st.profileMap.get(String(s.user_login || "").toLowerCase()) || "";
        track.appendChild(buildStreamTile(s, profile));
    });
    st.loaded += chunk.length;
    st.loading = false;

    if ((st.loaded < st.streams.length || (st.cursor && !st.done)) && track.scrollWidth <= track.clientWidth + 10) {
        loadMoreForRow(sectionId);
    }
}

const FOLLOWED_MAX = 20;
async function loadSeguidosChannels() {
    const row = document.querySelector('.section-row[data-section-id="seguidosChannels"]');
    const track = document.getElementById("track-seguidosChannels");
    if (!row || !track) return;
    const [liveStreams, channels] = await Promise.all([fetchFollowedLiveStreams(), fetchFollowedChannels()]);
    if (!twitchUser) return;
    if (!liveStreams.length && !channels.length) {

        return;
    }
    const liveIds = new Set(liveStreams.map(s => s.user_id));
    const offline = channels.filter(c => !liveIds.has(c.broadcaster_id));
    const sortedLive = liveStreams.slice().sort((a, b) => Number(b.viewer_count || 0) - Number(a.viewer_count || 0)).slice(0, FOLLOWED_MAX);
    const HEAD = 100;                       // el primer lote se ordena por última transmisión
    const head = offline.slice(0, HEAD);
    const rest = offline.slice(HEAD);
    const [profileMap, coverMap, offlineAvatarMap, lastLiveMap] = await Promise.all([
        getStreamerProfileMap(sortedLive),
        fetchUserCoverImagesByLogin(head.map(c => c.broadcaster_login)),
        fetchUserAvatarsByLogin(head.map(c => c.broadcaster_login)),
        fetchLastLiveByUserIds(head.map(c => c.broadcaster_id))
    ]);
    const byLastLive = (a, b) => {
        const ta = lastLiveMap.get(a.broadcaster_id);
        const tb = lastLiveMap.get(b.broadcaster_id);
        if (ta && tb) return new Date(tb) - new Date(ta);
        if (ta && !tb) return -1;
        if (!ta && tb) return 1;
        return (a.broadcaster_name || a.broadcaster_login)
            .localeCompare(b.broadcaster_name || b.broadcaster_login, "es");
    };
    const ready = head.slice().sort(byLastLive);
    track.innerHTML = "";
    sortedLive.forEach(s => {
        const profile = profileMap.get(String(s.user_login || "").toLowerCase()) || "";
        track.appendChild(buildStreamTile(s, profile));
    });
    const buildOffline = c => buildOfflineFollowedTile(
        c,
        coverMap.get(c.broadcaster_login) || "",
        offlineAvatarMap.get(c.broadcaster_login) || "",
        formatLastLiveLabel(lastLiveMap.get(c.broadcaster_id))
    );
    ready.splice(0, Math.max(0, FOLLOWED_MAX - sortedLive.length)).forEach(c => track.appendChild(buildOffline(c)));
    if (focusZone === "content" && contentRowId === "seguidosChannels") {
        focusContentTile("seguidosChannels", contentTileIndex);
    } else if (focusZone === "content" && !contentRowIdWasChangedByUser) {

    }

function formatLastLiveLabel(iso) {
    if (!iso) return "Sin transmisiones recientes";
    const then = new Date(iso).getTime();
    if (Number.isNaN(then)) return "Sin transmisiones recientes";
    const diffMs = Math.max(0, Date.now() - then);
    const minute = 60000, hour = 3600000, day = 86400000, month = day * 30, year = day * 365;
    let text;
    if (diffMs < hour) {
        const m = Math.max(1, Math.round(diffMs / minute));
        text = `hace ${m} min`;
    } else if (diffMs < day) {
        const h = Math.round(diffMs / hour);
        text = `hace ${h} h`;
    } else if (diffMs < day * 2) {
        text = "ayer";
    } else if (diffMs < month) {
        const d = Math.round(diffMs / day);
        text = `hace ${d} días`;
    } else if (diffMs < year) {
        const mo = Math.round(diffMs / month);
        text = `hace ${mo} ${mo === 1 ? "mes" : "meses"}`;
    } else {
        const y = Math.round(diffMs / year);
        text = `hace ${y} ${y === 1 ? "año" : "años"}`;
    }
    return `Última vez en vivo: ${text}`;
}

function setChannelBannerFromImage(url) {
    const root = document.getElementById("results-screen");
    const banner = document.getElementById("channel-banner");
    if (!url || !root || !banner) return;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
        try {
            const c = document.createElement("canvas");
            const ctx = c.getContext("2d", {willReadFrequently:true});
            c.width = 24; c.height = 24;
            ctx.drawImage(img, 0, 0, c.width, c.height);
            const data = ctx.getImageData(0, 0, c.width, c.height).data;
            let r=0,g=0,b=0,n=0;
            for (let i=0;i<data.length;i+=4) {
                if (data[i+3] < 120) continue;
                r += data[i]; g += data[i+1]; b += data[i+2]; n++;
            }
            if (!n) return;
            r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
            const max=Math.max(r,g,b), min=Math.min(r,g,b);
            if (max-min < 18) { r=Math.min(255,r+18); b=Math.min(255,b+30); }
            const accent=`rgb(${r}, ${g}, ${b})`;
            root.style.setProperty("--channel-accent", accent);
            banner.style.backgroundImage = `linear-gradient(180deg, rgba(${r},${g},${b},.88), rgba(15,15,18,.98))`;
            banner.style.backgroundColor = accent;
        } catch (_) {}
    };
    img.src = url;
}

async function getAppToken() {

    if (tokenRequestInFlight) return tokenRequestInFlight;
    tokenRequestInFlight = (async () => {
        try {
            const res = await fetch(TWITCH_TOKEN_ENDPOINT, { cache: "no-store" });
            const data = await res.json();
            if (!res.ok || !data.access_token) {
                console.error("Twitch token error:", data.message || res.status);
                return null;
            }
            twitchAppToken = data.access_token;
            TWITCH_CLIENT_ID = data.client_id || TWITCH_CLIENT_ID;
            twitchTokenExpiresAt = Date.now() + (data.expires_in || 3600) * 1000;
            return twitchAppToken;
        } catch (e) {
            console.error(e);
            return null;
        } finally {
            tokenRequestInFlight = null;
        }
    })();

}
async function helixGet(path) {

    try {
        const res = await fetch(`https://api.twitch.tv/helix/${path}`, {
            headers: { "Client-Id": TWITCH_CLIENT_ID, "Authorization": `Bearer ${token}` }
        });
        if (res.status === 401) {
            twitchAppToken = null;
            twitchTokenExpiresAt = 0;
            const fresh = await getAppToken();
            if (!fresh) return { data: [] };
            const retry = await fetch(`https://api.twitch.tv/helix/${path}`, {
                headers: { "Client-Id": TWITCH_CLIENT_ID, "Authorization": `Bearer ${fresh}` }
            });
            return await retry.json();
        }
        return await res.json();
    } catch (e) { console.error(e); return { data: [] }; }
}

async function helixGetAsUser(path) {

async function startRedirectLogin() {
    await getAppToken();
    if (!TWITCH_CLIENT_ID) {
        renderAccountOverlay("qr-error", "No se pudo preparar el login (sin conexión con Twitch).");
        return;
    }
    const state = randomOAuthState();
    try { sessionStorage.setItem("tw_oauth_state", state); } catch (e) {}
    const redirectUri = `${API_BASE || location.origin}/api/twitch-auth-callback`;
    const params = new URLSearchParams({
        client_id: TWITCH_CLIENT_ID,
        redirect_uri: redirectUri,
        response_type: "code",
        scope: TWITCH_SCOPES,
        state

    location.href = `https://id.twitch.tv/oauth2/authorize?${params.toString()}`;
}
let deviceLoginToken = 0;
function stopDeviceLogin() {
    deviceLoginToken++;
    if (deviceFlowState && deviceFlowState.timer) clearTimeout(deviceFlowState.timer);
    deviceFlowState = null;
}
async function startDeviceLogin() {
    stopDeviceLogin();
    const tok = deviceLoginToken;
    const stale = () => tok !== deviceLoginToken || activePanel !== "account";
    renderAccountOverlay("qr-loading");
    await getAppToken();
    if (stale()) return;
    try {
        const res = await fetch(`${API_BASE}/api/twitch-device-start?scopes=${encodeURIComponent(TWITCH_SCOPES)}`, { cache: "no-store" });
        const data = await res.json();
        if (stale()) return;
        if (!res.ok || !data.device_code) {
            renderAccountOverlay("qr-error", data.message || "No se pudo iniciar el login por QR.");
            return;
        }
        deviceFlowState = {
            device_code: data.device_code,
            interval: Math.max(2, Number(data.interval) || 5) * 1000,
            expiresAt: Date.now() + (Number(data.expires_in) || 1800) * 1000,
            timer: null
        };
        renderAccountOverlay("qr", { verification_uri: data.verification_uri, user_code: data.user_code });
        deviceFlowState.timer = setTimeout(pollDeviceLogin, deviceFlowState.interval);
    } catch (e) {
        if (stale()) return;
        renderAccountOverlay("qr-error", "No se pudo conectar con Twitch.");
    }
}
async function pollDeviceLogin() {
    if (!deviceFlowState) return;
    if (Date.now() > deviceFlowState.expiresAt) {
        deviceFlowState = null;
        renderAccountOverlay("qr-error", "El código QR expiró. Probá de nuevo.");
        return;
    }
    const current = deviceFlowState;
    try {
        const res = await fetch(`${API_BASE}/api/twitch-device-poll?device_code=${encodeURIComponent(current.device_code)}`, { cache: "no-store" });
        const data = await res.json();
        if (res.ok && data.access_token) {
            deviceFlowState = null;
            saveTwitchUser({
                access_token: data.access_token,
                refresh_token: data.refresh_token || null,
                expires_at: Date.now() + (Number(data.expires_in) || 14400) * 1000,
                user_id: data.user_id || null,
                login: data.login || null,
                display_name: data.display_name || data.login || null,
                profile_image_url: data.profile_image_url || null
            });
            renderAccountOverlay("logged-in");
            if (currentScreen === "main" && !panelFocused && activePanel === "account") setFocus("nav", navIndex);
            return;
        }
        const msg = String(data.message || "");
        if (msg === "authorization_pending" || msg === "") {
            current.timer = setTimeout(pollDeviceLogin, current.interval);
            return;
        }
        deviceFlowState = null;
        renderAccountOverlay("qr-error", "No se pudo completar el login (" + msg + ").");
    } catch (e) {
        current.timer = setTimeout(pollDeviceLogin, current.interval);
    }
}
function logoutTwitch() {
    stopDeviceLogin();
    clearTwitchUser();
    renderAccountOverlay("logged-out");
}

function getDeviceInfo() {
    const info = { platform: "web", model: "", firmware: "", tizen: "", screen: (window.innerWidth || 0) + "x" + (window.innerHeight || 0), ua: String(navigator.userAgent || "").slice(0, 200) };
    try {
        if (window.Capacitor && typeof window.Capacitor.getPlatform === "function") info.platform = "capacitor-" + window.Capacitor.getPlatform();
        if (window.tizen) info.platform = "tizen";
        if (window.webapis && window.webapis.productinfo) {
            const pi = window.webapis.productinfo;
            try { info.model = pi.getRealModel() || pi.getModel() || ""; } catch (_) { try { info.model = pi.getModel() || ""; } catch (__) {} }
            try { info.firmware = pi.getFirmware() || ""; } catch (_) {}

}

}
async function sendFeedback(text) {
    text = String(text || "").trim();
    if (text.length < 5) { showFeedbackToast("Escribe un comentario un poco más largo."); return; }
    let last = 0;
    try { last = Number(localStorage.getItem("osmtwich-feedback-last") || 0); } catch (_) {}
    if (Date.now() - last < 60000) { showFeedbackToast("Espera un minuto antes de enviar otro comentario."); return; }
    showFeedbackToast("Enviando comentario…");
    try {
        const res = await fetch(`${API_BASE}/api/feedback`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text.slice(0, 500), device: getDeviceInfo() })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        try { localStorage.setItem("osmtwich-feedback-last", String(Date.now())); } catch (_) {}
        showFeedbackToast("¡Gracias! Comentario enviado.");
    } catch (e) {
        showFeedbackToast("No se pudo enviar el comentario. Inténtalo más tarde.");
    }
}

function wireAccountButtons() {

        if (btn.dataset.action === "donate-select") {
            btn.addEventListener("focus", () => {

                if (method && method !== donateMethodSelected) {
                    donateMethodSelected = method;
                    renderDonatePanel();
                    const next = document.querySelector('#account-box [data-method="' + method + '"]');
                    if (next) {

                    }

        }
    });

function handleAccountAction(action, btn) {
    if (action === "donate-select") {
        const method = btn && btn.dataset ? btn.dataset.method : "";
        if (method === "paypal" || method === "nequi") {
            donateMethodSelected = method;
            renderDonatePanel();
            const selected = document.querySelector('#account-box [data-method="' + method + '"]');
            if (selected) {
                selected.classList.add("focused");
                try { selected.focus({ preventScroll: true }); } catch (_) {}
            }
        }
        return;
    }
    if (action === "feedback-open") return openFeedbackKeyboard();
    if (action === "redirect") return startRedirectLogin();
    if (action === "qr") return startDeviceLogin();
    if (action === "logout") return logoutTwitch();
    if (action === "close") return closeAccountOverlay();
    if (action === "settings") return renderAccountSettings();
    if (action === "back-to-menu") return renderAccountOverlay(twitchUser ? "logged-in" : "logged-out");
    if (action === "reload-app") return window.location.reload();
    if (action === "open-channel") {
        const login = btn && btn.dataset ? btn.dataset.login : "";
        hidePanel();
        if (login) openChannel(login);
        return;
    }
    if (action === "view-profile") {
        const login = (btn && btn.dataset ? btn.dataset.login : "") || (twitchUser && twitchUser.login) || "";
        if (currentScreen === "main") rememberMainFocusForReturn();
        hidePanel();
        if (login) runSearch(login);
        return;
    }
}

  const sidebar = document.getElementById('sidebar');
  if (!screen || !sidebar) return;
  function setSidebarState(active) {
    screen.classList.toggle('sidebar-active', active);
    screen.classList.toggle('sidebar-collapsed', !active);
    try { localStorage.setItem('sidebarCollapsed', active ? '0' : '1'); } catch(e) {}
  }
  setSidebarState(true);
  document.addEventListener('focusin', function(e) {
    if (!screen.contains(e.target)) return;
    if (e.target.closest('#sidebar')) {
      setSidebarState(true);
    } else if (e.target.closest('#content, .tile-stream, .tile-game, .tile-clip')) {
      setSidebarState(false);
    }
  });
  document.addEventListener('pointerdown', function(e) {
    if (!screen.contains(e.target)) return;
    if (e.target.closest('#sidebar')) {
      setSidebarState(true);
    } else if (e.target.closest('#content, .tile-stream, .tile-game, .tile-clip')) {
      setSidebarState(false);
    }
  });
  window.addEventListener('popstate', function(){ setSidebarState(true); });
})();
</script>
<script>

    const active = document.activeElement === search ||
                   search.matches(":hover") ||
                   root.classList.contains("search-active") ||
                   root.classList.contains("search-open");
    if (active) {
      root.classList.remove("sidebar-active");
      root.classList.remove("search-active", "search-open", "searching");
      const content = document.getElementById("content");
      if (content) content.style.filter = "none";
    }
  }
  search.addEventListener("focus", noBlurOnSearch);
  search.addEventListener("click", noBlurOnSearch);
})();
</script>

<script id="search-nav-fix">
(function () {
    const getSearch = () => document.getElementById("search-nav-item");

        const search = getSearch();
        if (!search) return;

        search.classList.add("focused");
    }

        e.stopPropagation();

        if (e.target.closest("#search-nav-item")) e.stopPropagation();
    }, true);
    document.addEventListener("keydown", function (e) {
        const overlay = document.getElementById("home-search-overlay");

        if (e.target && e.target.id === "home-search-input") getSearch()?.classList.add("focused");
    }, true);

<script id="tv-4k-scale-script-v60">
(function(){
    var BASELINE_WIDTH = 1920;
    var BASELINE_HEIGHT = 1080;
    var isTizenApp = !!(window.tizen && window.tizen.application);
    if (!isTizenApp) return;
    function getViewportSize(){
        var w = window.innerWidth || document.documentElement.clientWidth || (window.screen && window.screen.width);
        var h = window.innerHeight || document.documentElement.clientHeight || (window.screen && window.screen.height);
        return { w: w, h: h };
    }
    function wrapBody(){
        if (document.getElementById('tv-scale-root')) return document.getElementById('tv-scale-root');
        var root = document.createElement('div');
        root.id = 'tv-scale-root';
        while (document.body.firstChild) {
            root.appendChild(document.body.firstChild);
        }
        document.body.appendChild(root);
        return root;
    }
    function applyTvScale(){
        var size = getViewportSize();
        if (!size.w || !size.h) return;
        var root = wrapBody();
        var scaleX = size.w / BASELINE_WIDTH;
        var scaleY = size.h / BASELINE_HEIGHT;
        var scale = Math.min(scaleX, scaleY);
        root.style.transform = 'scale(' + scale + ')';
        document.documentElement.setAttribute('data-tv-scaled', '1');
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyTvScale);
    } else {
        applyTvScale();
    }
    window.addEventListener('resize', applyTvScale);
    window.addEventListener('orientationchange', applyTvScale);
    window.addEventListener('load', applyTvScale);
    setTimeout(applyTvScale, 400);
    setTimeout(applyTvScale, 1500);
})();
</script>
<script id="double-back-exit-v59">
(function(){
    var exitArmed = false;
    var exitTimer = null;
    var TOAST_ID = 'double-back-exit-toast-v59';
    function showExitWarning(msg){
        var el = document.getElementById(TOAST_ID);
        if (!el) {
            el = document.createElement('div');
            el.id = TOAST_ID;
            el.style.cssText = 'position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);' +
                'background:rgba(24,24,27,.95);color:#fff;padding:14px 26px;border-radius:10px;' +
                'font-size:clamp(16px,1.8vw,22px);z-index:2147483647;box-shadow:0 4px 20px rgba(0,0,0,.4);' +
                'pointer-events:none;opacity:0;transition:opacity .2s ease;white-space:nowrap;';
            (document.body || document.documentElement).appendChild(el);
        }
        el.textContent = msg;
        requestAnimationFrame(function(){ el.style.opacity = '1'; });
        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(function(){ el.style.opacity = '0'; }, 1800);
    }
    function exitApp(){
        try {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App &&
                typeof window.Capacitor.Plugins.App.exitApp === 'function') {
                window.Capacitor.Plugins.App.exitApp();
                return;
            }
        } catch (e) {}
        try {
            if (window.tizen && window.tizen.application) {
                window.tizen.application.getCurrentApplication().exit();
                return;
            }
        } catch (e) {}
        try { window.close(); } catch (e) {}
    }
    function isAtRoot(){
        try {
            if (typeof currentScreen === 'undefined' || currentScreen !== 'main') return false;
            var acc = document.getElementById('account-overlay');
            var sea = document.getElementById('home-search-overlay');
            if (acc && acc.classList.contains('visible') && panelFocused) return false;
            if (sea && sea.classList.contains('visible')) return false;
            if (window.OsmPicker && OsmPicker.isOpen && OsmPicker.isOpen()) return false;
            if (typeof focusZone !== 'undefined' && focusZone === 'content' &&
                !(typeof contentTileIndex !== 'undefined' && contentTileIndex === 0)) return false;
            return true;
        } catch (e) { return true; }
    }
    function handleBackPress(evt){
        if (!isAtRoot()) { exitArmed = false; clearTimeout(exitTimer); return; }
        if (evt && typeof evt.preventDefault === 'function') { try { evt.preventDefault(); } catch(e){} }
        if (exitArmed) {
            clearTimeout(exitTimer);
            exitApp();
            return;
        }
        exitArmed = true;
        showExitWarning('¿Deseas salir? Pulsa atrás de nuevo para salir de la app');
        exitTimer = setTimeout(function(){ exitArmed = false; }, 2000);
    }
    document.addEventListener('tizenhwkey', function (e) {
        if (e && e.keyName === 'back') {
            handleBackPress(e);
        }
    });
})();
</script>

<script id="android-back-button-v1">
(function () {
    if (!window.Capacitor) return;
    var DOUBLE_BACK_WINDOW_MS = 2000;
    var lastBackPressAt = 0;
    var toastTimer = null;
    function showExitToast() {
        var el = document.getElementById("android-exit-toast");
        if (!el) {
            el = document.createElement("div");
            el.id = "android-exit-toast";
            el.textContent = "Presiona atrás de nuevo para salir";
            el.style.cssText =
                "position:fixed;left:50%;bottom:48px;transform:translateX(-50%);" +
                "background:rgba(24,24,27,.95);color:#fff;font-size:15px;" +
                "padding:10px 18px;border-radius:8px;z-index:99999;" +
                "opacity:0;transition:opacity .15s ease;pointer-events:none;";
            document.body.appendChild(el);
        }
        el.style.opacity = "1";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
            el.style.opacity = "0";
        }, DOUBLE_BACK_WINDOW_MS);
    }
    function isAtRootScreen() {
        var accountOverlay = document.getElementById("account-overlay");
        var searchOverlay = document.getElementById("home-search-overlay");
        var accountOpen = accountOverlay && accountOverlay.classList.contains("visible") && panelFocused;
        var searchOpen = searchOverlay && searchOverlay.classList.contains("visible");
        return typeof currentScreen !== "undefined" && currentScreen === "main" && !accountOpen && !searchOpen;
    }
    function handleAndroidBack(e) {
        if (window.OskKeyboard && OskKeyboard.isOpen()) { OskKeyboard.close(); return; }
        if (window.OsmPicker && OsmPicker.isOpen()) { OsmPicker.close(); return; }
        var accountOverlay = document.getElementById("account-overlay");
        if (accountOverlay && accountOverlay.classList.contains("visible") && panelFocused) {
            closeAccountOverlay();
            return;
        }
        var searchOverlay = document.getElementById("home-search-overlay");
        if (searchOverlay && searchOverlay.classList.contains("visible")) {
            closeHomeSearch();
            return;
        }
        if (!isAtRootScreen()) {
            goBack();
            return;
        }
        var now = Date.now();
        if (now - lastBackPressAt < DOUBLE_BACK_WINDOW_MS) {
            window.Capacitor.Plugins.App.exitApp();
        } else {
            lastBackPressAt = now;
            showExitToast();
        }
    }
    if (window.Capacitor.Plugins && window.Capacitor.Plugins.App &&
        typeof window.Capacitor.Plugins.App.addListener === "function") {
        window.Capacitor.Plugins.App.addListener("backButton", handleAndroidBack);
    }
    document.addEventListener("backButton", handleAndroidBack);
})();
</script>

(function () {
