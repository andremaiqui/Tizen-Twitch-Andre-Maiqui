name: Compilar Tizen (.wgt)

# Gera e publica o pacote Tizen a cada atualização da branch main.
concurrency:
  group: osmtwich-release-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Primeira versão do esquema: 2.7.1 -> 2.7.2 ... 2.7.9 -> 2.8.0 ...
  # (a lógica está em .github/scripts/compute-version.sh)
  VERSION_START: "2.7.1"

jobs:
  build-wgt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar versão em config.xml
        run: |
          APP_VERSION="$(bash .github/scripts/compute-version.sh)"
          sed -i -E "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"$APP_VERSION\"/" index.html
          grep -q "const APP_VERSION = \"$APP_VERSION\"" index.html || { echo "ERRO: não foi possível atualizar APP_VERSION"; exit 1; }
          VERSION="$APP_VERSION"
          echo "Nova versão: $VERSION"
          VERSION="$VERSION" perl -0pi -e 's/(<widget\b[^>]*?\sversion=")[^"]*(")/$1$ENV{VERSION}$2/s' tizen/config.xml
          grep -q "version=\"$VERSION\"" tizen/config.xml || { echo "ERRO: não foi possível atualizar a versão em config.xml"; exit 1; }
          grep -n 'version=' tizen/config.xml

      - name: Empacotar .wgt sem assinatura
        run: |
          # O app é incluído diretamente como index.html no .wgt, sem um iniciador
          # que redireciona para app.html. Assim funciona na TV e nos emuladores web,
          # nos quais a navegação por caminho relativo poderia retornar erro 404.
          cp index.html tizen/index.html
          cp twitch-logo.png tizen/twitch-logo.png
          cd tizen
          zip -r ../OsmTwich.wgt . -x ".*"
          cd ..
          ls -la OsmTwich.wgt

      - name: Enviar artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: OsmTwich-wgt
          path: OsmTwich.wgt

      - name: Criar ou atualizar a versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Twitch for TizenOS - Andre Maiqui - ${{ env.APP_VERSION }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: OsmTwich.wgt
          body: |
            Versão: ${{ env.APP_VERSION }}

            ## Alterações
            Atualização do aplicativo Twitch e melhorias de compatibilidade para TVs Samsung com Tizen.

            O pacote `.wgt` está disponível para download nos arquivos desta versão.

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Registrar versão da sequência
        run: |
          TAG="osmtwich-version-v${APP_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "A versão $APP_VERSION já está registrada."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
