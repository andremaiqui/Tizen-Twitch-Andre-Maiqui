name: Compilar Tizen (.wgt)

# Gera e publica o pacote Tizen a cada atualização da branch main.
concurrency:
  group: osmtwich-release-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Primeira versão do esquema: 2.7.1 -> 2.7.2 ... 2.7.9 -> 2.8.0 ...
  # (a lógica está em .github/scripts/compute-version.sh)
  VERSION_START: "2.7.1"

jobs:
  build-wgt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar versão em config.xml
        id: version
        run: |
          APP_VERSION="$(bash .github/scripts/compute-version.sh)"
          WGT_NAME="Twitch-for-TizenOS-Andre-Maiqui-${APP_VERSION}.wgt"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "wgt_name=$WGT_NAME" >> "$GITHUB_OUTPUT"
          sed -i -E "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"$APP_VERSION\"/" index.html
          grep -q "const APP_VERSION = \"$APP_VERSION\"" index.html || { echo "ERRO: não foi possível atualizar APP_VERSION"; exit 1; }
          VERSION="$APP_VERSION"
          echo "Nova versão: $VERSION"
          VERSION="$VERSION" perl -0pi -e 's/(<widget\b[^>]*?\sversion=")[^"]*(")/$1$ENV{VERSION}$2/s' tizen/config.xml
          grep -q "version=\"$VERSION\"" tizen/config.xml || { echo "ERRO: não foi possível atualizar a versão em config.xml"; exit 1; }
          grep -n 'version=' tizen/config.xml

      - name: Empacotar .wgt sem assinatura
        env:
          WGT_NAME: ${{ steps.version.outputs.wgt_name }}
        run: |
          # O WebKit de TVs Tizen antigas não entende sintaxe JavaScript recente
          # (por exemplo, async/await e encadeamento opcional). Gere uma cópia
          # compatível com o Chromium M47 usado em TVs Tizen de 2017; o index.html
          # da versão web permanece intacto.
          npm install --no-save --no-package-lock @babel/core@^7 @babel/preset-env@^7
          node .github/scripts/transpile-tizen.js index.html tizen/index.html
          cp twitch-logo.png tizen/twitch-logo.png
          cd tizen
          zip -r "../$WGT_NAME" . -x ".*"
          cd ..
          ls -la "$WGT_NAME"

      - name: Enviar artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: Twitch-for-TizenOS-Andre-Maiqui-${{ steps.version.outputs.app_version }}
          path: ${{ steps.version.outputs.wgt_name }}

      - name: Criar ou atualizar a versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          name: Twitch for TizenOS - Andre Maiqui - ${{ steps.version.outputs.app_version }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: ${{ steps.version.outputs.wgt_name }}
          body: |
            Versão: ${{ steps.version.outputs.app_version }}

            ## Alterações
            Atualização do aplicativo Twitch e melhorias de compatibilidade para TVs Samsung com Tizen.

            O pacote `.wgt` está disponível para download nos arquivos desta versão.

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Registrar versão da sequência
        run: |
          TAG="osmtwich-version-v${{ steps.version.outputs.app_version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "A versão ${{ steps.version.outputs.app_version }} já está registrada."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
